<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>બાળગીતો અને ભજન/ધૂન</title>

  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .player {
      max-width: 550px;
      margin: 20px auto;
      padding: 20px;
      background: #222;
      border-radius: 15px;
    }

    audio {
      display: block;
      width: 100%;
      margin: 18px 0;
    }

    .sections,
    .controls {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 15px;
    }

    button {
      padding: 10px 16px;
      border: 0;
      border-radius: 8px;
      background: #0f6c42;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover,
    button.selected {
      background: #168653;
    }

    .playlist {
      max-height: 300px;
      overflow-y: auto;
      padding: 8px;
      background: #1a1a1a;
      border-radius: 10px;
      text-align: left;
    }

    .song {
      display: block;
      width: 100%;
      margin: 0;
      padding: 12px;
      border-bottom: 1px solid #333;
      border-radius: 5px;
      background: transparent;
      text-align: left;
    }

    .song.active {
      background: #0f6c42;
    }

    #status {
      min-height: 24px;
      color: #ffd166;
    }
  </style>
</head>

<body>
  <h2>🎵 બાળગીતો અને ભજન/ધૂન</h2>

  <main class="player">
    <h3>વિભાગ પસંદ કરો</h3>
    <div class="sections" id="sectionButtons"></div>

    <h3 id="sectionTitle"></h3>
    <h3 id="now">ગીત પસંદ કરો</h3>

    <audio id="audio" controls preload="metadata"></audio>

    <div class="controls">
      <button type="button" id="prevButton">⏮ પાછળ</button>
      <button type="button" id="nextButton">આગળ ⏭</button>
      <button type="button" id="loopButton">🔁 વિભાગ લૂપ: ચાલુ</button>
    </div>

    <p id="status" aria-live="polite"></p>
    <div class="playlist" id="playlist"></div>
  </main>

  <script>
    // દરેક ગીતનું file નામ GitHub પરના MP3 નામ સાથે મેળવો.
    const sections = {
      balgeet: {
        title: "બાળગીતો",
        songs: [
          { title: "બાળગીત 1", file: "Geet1.mp3" },
          { title: "બાળગીત 2", file: "Geet2.mp3" },
          { title: "બાળગીત 3", file: "Geet3.mp3" },
          { title: "બાળગીત 4", file: "Geet4.mp3" },
          { title: "બાળગીત 5", file: "Geet5.mp3" },
          { title: "બાળગીત 6", file: "Geet6.mp3" },
          { title: "બાળગીત 7", file: "Geet7.mp3" },
          { title: "બાળગીત 8", file: "Geet8.mp3" },
          { title: "બાળગીત 9", file: "Geet9.mp3" },
          { title: "બાળગીત 10", file: "Geet10.mp3" },
          { title: "બાળગીત 11", file: "Geet11.mp3" },
          { title: "બાળગીત 12", file: "Geet12.mp3" },
          { title: "બાળગીત 13", file: "Geet13.mp3" },
          { title: "બાળગીત 14", file: "Geet14.mp3" },
          { title: "બાળગીત 15", file: "Geet15.mp3" },
          { title: "બાળગીત 16", file: "Geet16.mp3" },
          { title: "બાળગીત 17", file: "Geet17.mp3" },
          { title: "બાળગીત 18", file: "Geet18.mp3" },
          { title: "બાળગીત 19", file: "Geet19.mp3" },
          { title: "બાળગીત 20", file: "Geet20.mp3" },
          { title: "બાળગીત 21", file: "Geet21.mp3" },
          { title: "બાળગીત 22", file: "Geet22.mp3" },
          { title: "બાળગીત 23", file: "Geet23.mp3" },
          { title: "બાળગીત 24", file: "Geet24.mp3" },
          { title: "બાળગીત 25", file: "Geet25.mp3" },
          { title: "બાળગીત 26", file: "Geet26.mp3" },
          { title: "બાળગીત 27", file: "Geet27.mp3" },
          { title: "બાળગીત 28", file: "Geet28.mp3" },
          { title: "બાળગીત 29", file: "Geet29.mp3" },
          { title: "બાળગીત 30", file: "Geet30.mp3" }
        ]
      },

      bhajan: {
        title: "ભજન/ધૂન",
        songs: [
          // અહીં તમારી ભજનની ફાઇલો ઉમેરો.
          // ઉદાહરણ:
          // { title: "ભજન 1", file: "Bhajan1.mp3" },
          // { title: "ભજન 2", file: "Bhajan2.mp3" }
        ]
      }
    };

    let currentSection = "balgeet";
    let currentIndex = 0;
    let loopSection = true;

    const audio = document.getElementById("audio");
    const now = document.getElementById("now");
    const sectionTitle = document.getElementById("sectionTitle");
    const sectionButtons = document.getElementById("sectionButtons");
    const playlist = document.getElementById("playlist");
    const status = document.getElementById("status");
    const loopButton = document.getElementById("loopButton");

    function getCurrentSongs() {
      return sections[currentSection].songs;
    }

    function renderSectionButtons() {
      sectionButtons.replaceChildren();

      Object.entries(sections).forEach(([key, section]) => {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = section.title;
        button.classList.toggle("selected", key === currentSection);

        button.addEventListener("click", () => {
          currentSection = key;
          currentIndex = 0;
          renderSectionButtons();
          renderPlaylist();
        });

        sectionButtons.appendChild(button);
      });
    }

    function renderPlaylist() {
      const section = sections[currentSection];
      const songs = section.songs;

      sectionTitle.textContent = section.title;
      playlist.replaceChildren();
      status.textContent = "";

      if (songs.length === 0) {
        now.textContent = "આ વિભાગમાં હજી ગીત ઉમેર્યાં નથી";
        audio.removeAttribute("src");
        audio.load();
        return;
      }

      songs.forEach((song, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "song";
        button.textContent = `${index + 1}. ${song.title}`;

        button.addEventListener("click", () => playSong(index));
        playlist.appendChild(button);
      });

      updateActiveSong();
      now.textContent = "ગીત પસંદ કરો અથવા Play દબાવો";
    }

    function updateActiveSong() {
      playlist.querySelectorAll(".song").forEach((button, index) => {
        button.classList.toggle("active", index === currentIndex);
      });
    }

    async function playSong(index) {
      const songs = getCurrentSongs();

      if (songs.length === 0) {
        status.textContent = "આ વિભાગમાં ગીતો ઉમેરેલાં નથી.";
        return;
      }

      currentIndex = (index + songs.length) % songs.length;

      const song = songs[currentIndex];
      audio.src = song.file;
      now.textContent = `🎶 ${song.title}`;
      status.textContent = "";
      updateActiveSong();

      try {
        await audio.play();
      } catch {
        status.textContent =
          "ગીત ચલાવવા માટે Play દબાવો. ન વાગે તો ફાઇલનું નામ તપાસો.";
      }
    }

    document.getElementById("prevButton").addEventListener("click", () => {
      playSong(currentIndex - 1);
    });

    document.getElementById("nextButton").addEventListener("click", () => {
      playSong(currentIndex + 1);
    });

    loopButton.addEventListener("click", () => {
      loopSection = !loopSection;
      loopButton.textContent =
        `🔁 વિભાગ લૂપ: ${loopSection ? "ચાલુ" : "બંધ"}`;
    });

    audio.addEventListener("ended", () => {
      const songs = getCurrentSongs();

      if (currentIndex < songs.length - 1) {
        playSong(currentIndex + 1);
      } else if (loopSection && songs.length > 0) {
        playSong(0);
      }
    });

    audio.addEventListener("error", () => {
      status.textContent =
        "ગીત લોડ થયું નથી. MP3 ફાઇલનું નામ અને સ્થાન તપાસો.";
    });

    renderSectionButtons();
    renderPlaylist();
  </script>
</body>
</html>
